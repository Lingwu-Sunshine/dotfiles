[module/i3-volume]
type = custom/script
tail = true
label = %output%
exec = ~/.config/polybar//i3-volume/volume listen "%i %v %p\n"
scroll-up = ~/.config/polybar/i3-volume/volume up
scroll-down = ~/.config/polybar/i3-volume/volume down
click-left = ~/.config/polybar/i3-volume/volume mute
click-right = exec pavucontrol &